name: Required OGHO template compliance

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository template
    if: github.repository != 'oracle-samples/ogho-compliance'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v7

      - name: Run OGHO template checks
        uses: oracle-samples/ogho-compliance/.github/actions/ogho-template-check@069d4ac6ace648592805e450da9abf64b3f25bb4
        with:
          contributing-policy: required
